
spring:
  application:
    name: tokit-backend

  # Database Connection (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tokit}
    username: ${DB_USERNAME:tokit}
    password: ${DB_PASSWORD:tokit}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tokit}
    user: ${DB_USERNAME:tokit}
    password: ${DB_PASSWORD:tokit}

  # JPA Configurations
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tokit}
    password: ${RABBITMQ_PASSWORD:tokit}

  # Spring Batch Configuration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: ${PORT:8080}

# 운영 모니터링 노출. 관리 포트를 분리해 공개 API 표면에 올라가지 않게 합니다.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: tokit-backend

logging:
  level:
    root: INFO
    com.tokit: DEBUG
    org.hibernate.SQL: DEBUG

# Custom configurations
tokit:
  fee:
    # 2차 거래 편도 수수료율 (매수/매도 각각 부과). 0.001 = 0.1%
    trading-rate: ${TRADING_FEE_RATE:0.001}
  jwt:
    # 로컬 개발용 기본 시크릿. 운영 환경에서는 반드시 JWT_SECRET 환경변수로 주입해야 합니다.
    secret: ${JWT_SECRET:tokit-local-development-secret-key-do-not-use-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  blockchain:
    rpc-url: ${BLOCKCHAIN_RPC_URL:http://localhost:8545}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
    private-key: ${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}

